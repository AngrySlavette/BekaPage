<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first page</title>
    <style>
        /* Aesthetic Styling */
        body {
            font-family: 'Calibri', sans-serif;
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            color: #5c2b5e;
            text-align: center;
            padding: 20px;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        h1 {
            font-size: 2.5em;
            font-weight: 700;
            color: #ff69b4;
            text-shadow: 2px 2px 5px rgba(255, 105, 180, 0.5);
            margin-bottom: 15px;
        }
        p {
            font-size: 1.2em;
            font-weight: bold;
            color: #d63384;
            margin-bottom: 15px;
        }

        /* Content Box */
        .content {
            max-width: 90%;
            width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(255, 105, 180, 0.4);
            border: 3px solid #ffb6c1;
        }

        /* Cute Button */
        .cute-button {
            display: inline-block;
            padding: 12px 20px;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            box-shadow: 0px 4px 10px rgba(255, 20, 147, 0.4);
            outline: none;
            border: 2px solid #ffb6c1;
            margin-top: 15px;
            width: 90%;
            max-width: 250px;
        }
        .cute-button:hover {
            transform: scale(1.08);
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            box-shadow: 0px 6px 15px rgba(255, 20, 147, 0.5);
        }

        /* Non-Transparent Bubble */
        .bubble {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            background: #ff69b4;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 50%;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 4px 10px rgba(255, 20, 147, 0.4);
            border: 2px solid white;
            display: none;
            z-index: 2;
        }

        /* Heart Rain */
        .heart {
            position: fixed;
            font-size: 20px;
            color: #ff69b4;
            top: -10px;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            from {
                transform: translateY(-10vh);
                opacity: 1;
            }
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

    </style>
</head>
<body>

    <h1>My first page</h1>

    <div class="content">
        <p><strong>I will now make a basic list</strong></p>
        <ol>
            <li>Different text formats:</li>
        </ol>
        <ul>
            <li><b>bold</b></li>
            <li><i>italic</i></li>
            <li><u>underline</u></li>
        </ul>

        <p><strong>I will now add a hyperlink to YouTube</strong></p>
        <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">YouTube</a>

        <p><strong>I will now add a useless button</strong></p>
        <button class="cute-button" onclick="showBubble()">I know you want to click me</button>
    </div>

    <!-- Cute Bubble -->
    <div id="bubble" class="bubble">not so useless</div>

    <script>
        function showBubble() {
            let bubble = document.getElementById("bubble");

            if (bubble.style.display !== "block") {
                bubble.style.display = "flex";
                createHearts();
            }
        }

        function createHearts() {
            for (let i = 0; i < 20; i++) {
                let heart = document.createElement("div");
                heart.classList.add("heart");
                heart.innerHTML = "❤️";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration = Math.random() * 2 + 3 + "s";
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 3000);
            }
        }
    </script>

</body>
</html>
